[pytest]
# 项目根自动加入 sys.path（由 tests/conftest.py 完成）
testpaths = tests
addopts = -v --tb=short
filterwarnings =
    ignore::DeprecationWarning
    ignore::FutureWarning
    ignore::UserWarning
# 只保留最近 3 次「有失败」的运行临时目录，避免 pytest-of-<user> 无限膨胀
# （默认 policy=all 会累积上百个目录，清理时易触发批量删除保护）
tmp_path_retention_policy = failed
tmp_path_retention_count = 3
