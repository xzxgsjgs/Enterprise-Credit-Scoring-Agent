[pytest]
# 项目根自动加入 sys.path（由 tests/conftest.py 完成）
testpaths = tests
# 默认跳过标记为 slow 的用例（真跑 Agent 闭环的那种，单个 30~60 秒）；
# 需要时显式跑：pytest -m slow tests/test_app_agent_e2e.py
addopts = -v --tb=short -m "not slow"
markers =
    slow: 真跑完整 Agent 闭环 / 页面端到端，耗时较长，默认跳过
filterwarnings =
    ignore::DeprecationWarning
    ignore::FutureWarning
    ignore::UserWarning
# 只保留最近 3 次「有失败」的运行临时目录，避免 pytest-of-<user> 无限膨胀
# （默认 policy=all 会累积上百个目录，清理时易触发批量删除保护）
tmp_path_retention_policy = failed
tmp_path_retention_count = 3
